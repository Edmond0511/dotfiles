# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix         # press prefix twice to send literal Ctrl+Space to apps

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Resize panes
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# Mouse support
set -g mouse on

# Sensible defaults
set -g base-index 1                 # windows start at 1
setw -g pane-base-index 1           # panes start at 1
set -g renumber-windows on          # no gaps after closing windows
set -g history-limit 10000          # bigger scrollback


